<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AndroidClaw — 한국 주식 트레이딩 운영 대시보드" />
  <meta name="color-scheme" content="light dark" />
  <title>AndroidClaw Dashboard</title>

  <link rel="stylesheet" href="css/tokens.css?v=4.3" />
  <link rel="stylesheet" href="css/base.css?v=4.3" />
  <link rel="stylesheet" href="css/components.css?v=4.3" />
</head>
<body>

<div class="shell">

  <header class="topbar">
    <div>
      <h1 class="topbar-title">AndroidClaw</h1>
      <div class="topbar-sub">트레이딩 운영 대시보드</div>
    </div>
    <div class="topbar-actions">
      <span class="section-meta">동기화 <span id="syncTime">—</span></span>
      <button class="btn" id="themeBtn" type="button">테마: 시스템</button>
      <button class="btn" id="refreshBtn" type="button">새로고침</button>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" aria-live="polite" data-visible="false"></div>

  <main id="domains" aria-live="polite">
    <div class="section">
      <div class="skeleton" style="height:64px"></div>
      <div class="skeleton" style="height:96px;margin-top:12px"></div>
    </div>
  </main>

</div>

<script src="js/core/format.js?v=4.3"></script>
<script src="js/core/ui.js?v=4.3"></script>
<script src="js/core/data.js?v=4.3"></script>
<script src="js/domains/kr_stock_market.js?v=4.3"></script>
<script src="js/domains/kr_stock.js?v=4.3"></script>
<script src="js/app.js?v=4.3"></script>

</body>
</html>
